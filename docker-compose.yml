services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: familyplanner
      POSTGRES_USER: ${POSTGRES_USER:-familyplanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-familyplanner} -d familyplanner"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    image: familyplanner:latest
    ports:
      - "8080:8080"
    environment:
      FAMILYPLANNER_PERSISTENCE: memory
      FAMILYPLANNER_DB_URL: jdbc:postgresql://db:5432/familyplanner
      FAMILYPLANNER_DB_USER: ${POSTGRES_USER:-familyplanner}
      FAMILYPLANNER_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      FAMILYPLANNER_SECRET: ${FAMILYPLANNER_SECRET:?set FAMILYPLANNER_SECRET in .env}
    restart: unless-stopped

volumes:
  pgdata: