<div id="event-modal" class="modal-overlay">
    <div class="card modal-card">
        <h3 style="margin-bottom: 1rem;">New Event</h3>
        <form hx-post="/app/households/{{ householdId }}/calendar/events"
              hx-target="#event-feedback"
              hx-swap="innerHTML">
            <div id="event-feedback"></div>
            <input type="hidden" name="timezone" value="{{ timezone }}">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" required>
            </div>
            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date" name="date" value="{{ today }}" required>
            </div>
            <div class="form-group">
                <label for="time">Time (optional)</label>
                <input type="time" id="time" name="time">
            </div>
            <div class="form-group">
                <label for="address">Address (optional)</label>
                <input type="text" id="address" name="address">
            </div>
            <div class="form-group">
                <label for="description">Description (optional)</label>
                <textarea id="description" name="description" rows="3"></textarea>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" onclick="document.getElementById('event-modal').classList.remove('open')">Cancel</button>
                <button type="submit" class="btn">Create</button>
            </div>
        </form>
    </div>
</div>
