<div id="event-modal" class="modal-overlay open">
    <div class="card modal-card">
        <h3 style="margin-bottom: 1rem">{% if event is not null %}Edit Event{% else %}New Event{% endif %}</h3>
        <form {% if event is not null %} hx-put="/app/households/{{householdId}}/calendar/events/{{event.id}}"
              {% else %}hx-post="/app/households/{{householdId}}/calendar/events"{% endif %}
            hx-target="#event-feedback"
            hx-swap="innerHTML">

            <div id="event-feedback"></div>
            <input type="hidden" name="timezone" value="{{timezone}}">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" value="{{event.title|default('')}}" required>
            </div>

            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date" name="date" value="{{event.date|default(today)}}" required>
            </div>

            <div class="form-group">
                <label for="time">Time (Optional)</label>
                <input type="time" id="time" name="time" value="{{event.time|default('')}}">
            </div>

            <div class="form-group">
                <label for="address">Address (optional)</label>
                <input type="text" id="address" name="address" value="{{ event.address|default('') }}">
            </div>

            <div class="form-group">
                <label for="description">Description (optional)</label>
                <textarea id="description" name="description" rows="3">{{ event.description|default('') }}</textarea>
            </div>

            <div class="modal-actions">
                {% if event is not null %}
                    <button type="button" class="btn btn-danger" style="margin-right: auto;"
                            hx-delete="/app/households/{{householdId}}/calendar/events/{{event.id}}"
                            hx-confirm="Delete this event?">Delete</button>
                {% endif %}
                <button type="button" class="btn btn-secondary" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
                <button type="submit" class="btn">
                    {% if event is not null %}
                        Save
                    {% else %}
                        Create
                    {% endif %}
                </button>
            </div>
        </form>
    </div>
</div>
